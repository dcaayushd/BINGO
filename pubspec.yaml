name: bingo
description: A Bingo game built with Flutter
version: 0.1.0

environment:
  sdk: ^3.6.1

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  just_audio: ^0.9.36
  shared_preferences: ^2.5.2
  socket_io_client: ^2.0.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
